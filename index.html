<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probably Stolen — Chem Calculator</title>
    <meta name="description" content="Interactive calculator for the game Probably Stolen. Calculate recipes, purity, cartel quotas, and profit.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calc">
    <div class="header">
        <div style="display:flex; align-items:center;">
            <h1 data-i18n="title">Probably Stolen</h1>
            <div class="sub" data-i18n="sub">Калькулятор химика</div>
        </div>
        <select class="lang-switch" id="langSwitch">
            <option value="ru">RU (Русский)</option>
            <option value="en">EN (English)</option>
        </select>
    </div>
    
    <div class="grid-container" id="mainGrid">
        <div class="col">
            <div class="field">
                <label for="recipe" data-i18n="product">Продукт</label>
                <select id="recipe">
                    <option value="dream_dust" data-i18n="dream_dust">Пыль снов</option>
                    <option value="nightmare_dust" data-i18n="nightmare_dust">Пыль кошмаров</option>
                    <option value="caffeine_pill" data-i18n="caffeine_pill">Таблетка кофеина</option>
                    <option value="phanta_pill" data-i18n="phanta_pill">Таблетка Фенты</option>
                    <option value="nomore_injector" data-i18n="nomore_injector">Инъектор Оксинета</option>
                    <option value="birth_control_pill" data-i18n="birth_control_pill">Противозачаточная таблетка</option>
                </select>
            </div>
            <div class="modgrid" id="modgrid"></div>
            <div class="field">
                <label data-i18n="alcohol">Тип алкоголя</label>
                <select id="alcoholType">
                    <option value="0.7" data-i18n="alcohol_70">Бутылка (70%)</option>
                    <option value="1.0" data-i18n="alcohol_100">Чистый (100%)</option>
                </select>
            </div>
            <div class="field">
                <label data-i18n="difficulty">Сложность</label>
                <select id="difficulty">
                    <option value="easy" data-i18n="diff_easy">ЦЕНЫ ЗАДРАНЫ</option>
                    <option value="normal" selected data-i18n="diff_normal">НОРМАЛЬНАЯ НАЦЕНКА</option>
                    <option value="hard" data-i18n="diff_hard">УЗКАЯ МАРЖА</option>
                    <option value="extreme" data-i18n="diff_extreme">ГОТОВЬТЕСЬ К УБЫТКАМ</option>
                </select>
            </div>
            <div class="panel">
                <div class="rtitle" data-i18n="scanner">📥 Данные со сканера</div>
                <div class="scanner-grid" id="scannerInputs"></div>
                <div id="portionTotals" class="portion-totals" style="display:none"></div>
            </div>
            <div class="panel">
                <div class="rtitle" data-i18n="costs">💸 Затраты</div>
                <div class="cost-grid">
                    <div class="cost-input" id="mushCostWrapper" style="grid-column:span 2">
                        <label data-i18n="cost_mush">Сумма на грибы</label>
                        <input type="number" id="totalMushCost" value="0" min="0" step="any">
                    </div>
                    <div class="cost-input">
                        <label data-i18n="cost_chem">Обычные припасы (50)</label>
                        <input type="number" id="useChemCount" value="0" min="0" step="1">
                    </div>
                    <div class="cost-input">
                        <label data-i18n="cost_restricted">Ограниченные (100)</label>
                        <input type="number" id="useRestrictedCount" value="0" min="0" step="1">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col">
            <div class="panel" style="flex:1">
                <div class="rtitle" data-i18n="recipe_process">📋 Рецепт и процесс</div>
                <div class="pipeline-box" id="pipelineBox"></div>
                <div id="warnings"></div>
                <div id="error" class="err"></div>
                <div id="steps"></div>
            </div>
        </div>
        
        <div class="col">
            <div class="panel">
                <div class="rtitle" data-i18n="results">📊 Результаты</div>
                <div class="output-box" id="outputBox"></div>
                <div id="revenueContainer"></div>
            </div>
        </div>
        
        <div class="col" id="col-cartel">
            <div class="panel cartel-panel" id="cartelBox" style="display:none">
                <div class="rtitle rtitle-cartel" data-i18n="cartel">👑 Сдача Картеля</div>
                <div class="scanner-grid" style="margin-bottom:10px">
                    <div class="scanner-card">
                        <h4 data-i18n="cartel_starch">Крахмал (мл)</h4>
                        <input type="number" id="scan_starch" value="0" min="0" step="0.01">
                    </div>
                    <div class="scanner-card">
                        <h4 data-i18n="cartel_sugar">Сахар (мл)</h4>
                        <input type="number" id="scan_sugar" value="0" min="0" step="0.01">
                    </div>
                </div>
                <div id="fillerInfo" style="font-size:.75rem;color:#8b9eb0;margin-bottom:10px;line-height:1.4;background:#1a232e;padding:6px;border-radius:6px"></div>
                <div class="field">
                    <label for="cartelWeek" data-i18n="cartel_week_number">Номер недели</label>
                    <input type="number" id="cartelWeek" min="1" step="1" value="1">
                    <div class="hint" data-i18n="cartel_week_hint">Квота растёт на 5 флаконов в неделю, чистота — до 70%.</div>
                </div>
                <div class="field">
                    <label for="cartelRep" data-i18n="cartel_rep">Репутация Картеля</label>
                    <input type="number" id="cartelRep" min="0" max="200" step="1" value="0">
                </div>
                <div class="field">
                    <label data-i18n="cartel_mode">Целевая чистота</label>
                    <select id="cartelMode">
                        <option value="normal" data-i18n="cartel_mode_normal">Ровно в цель</option>
                        <option value="bonus" selected data-i18n="cartel_mode_bonus">Цель +10</option>
                    </select>
                </div>
                <div id="cartelResult" style="margin-top:10px;background:#0d1319;border-radius:8px;padding:10px"></div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
